<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Insta Downloader</title>
    <style>
        /* Import Modern Font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { background-color: #09090b; color: #ffffff; overflow-x: hidden; position: relative; }

        /* Ambient Glowing Background Effect */
        .ambient-glow {
            position: absolute; top: -10%; left: 50%; transform: translateX(-50%);
            width: 80vw; height: 600px; z-index: -1; filter: blur(60px);
            background: radial-gradient(circle, rgba(111,0,255,0.18) 0%, rgba(255,0,128,0.06) 50%, rgba(0,0,0,0) 80%);
        }

        /* Navbar */
        header {
            display: flex; justify-content: space-between; align-items: center; padding: 20px 5%;
            background: rgba(9, 9, 11, 0.7); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); position: sticky; top: 0; z-index: 100;
        }

        .brand {
            font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .nav-links span { margin-left: 20px; font-size: 14px; font-weight: 600; color: #a1a1aa; cursor: pointer; transition: color 0.3s; }
        .nav-links span:hover { color: #fff; }

        /* Main Container */
        .main-wrapper { max-width: 900px; margin: 40px auto; padding: 0 20px; text-align: center; }

        h1 { font-size: 46px; font-weight: 800; line-height: 1.2; margin-bottom: 15px; letter-spacing: -1.5px; }
        .highlight { background: linear-gradient(90deg, #ff0844 0%, #ffb199 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 18px; color: #a1a1aa; margin-bottom: 40px; }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px); border-radius: 24px; padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); margin-bottom: 50px;
        }

        /* Modern Tabs */
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a1a1aa; padding: 12px 24px; border-radius: 12px; font-weight: 600;
            font-size: 15px; cursor: pointer; transition: all 0.3s ease;
        }
        .tab.active { background: #fff; color: #000; box-shadow: 0 0 20px rgba(255,255,255,0.2); }

        /* Input Field */
        .input-wrapper {
            display: flex; background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 8px; transition: border-color 0.3s;
        }
        .input-wrapper:focus-within { border-color: #4facfe; box-shadow: 0 0 15px rgba(79, 172, 254, 0.3); }
        input { flex: 1; background: transparent; border: none; color: #fff; font-size: 18px; padding: 0 20px; outline: none; }
        input::placeholder { color: #52525b; }

        /* Glowing Button */
        .btn-download {
            background: linear-gradient(90deg, #00f2fe, #4facfe); color: #fff; border: none;
            padding: 18px 40px; font-size: 18px; font-weight: 800; border-radius: 12px;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);
        }
        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(0, 242, 254, 0.5); }

        /* Extra Space for Ad Banners */
        .ad-space {
            width: 100%; height: 100px; background: rgba(255,255,255,0.02);
            border: 1px dashed rgba(255,255,255,0.2); border-radius: 16px; display: flex;
            align-items: center; justify-content: center; color: #52525b; font-weight: 600;
            margin: 40px 0; letter-spacing: 2px;
        }

        /* --- New Expanded Template Guide Section --- */
        .template-section { margin-top: 60px; text-align: left; }
        .template-section h2 { font-size: 28px; font-weight: 800; margin-bottom: 30px; text-align: center; }
        
        .guide-block { 
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px; padding: 30px; margin-bottom: 30px;
            display: flex; flex-direction: column; gap: 20px;
        }
        
        .guide-content h3 { font-size: 22px; margin-bottom: 10px; color: #4facfe; }
        .guide-content p { font-size: 15px; color: #a1a1aa; line-height: 1.6; }
        
        /* Simulated Mockups (Same as screenshots) */
        .mockup-box {
            width: 100%; background: #18181b; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 15px; text-align: center; font-size: 14px; color: #71717a;
        }
        .mockup-input {
            background: #000; border: 1px solid #ff0844; padding: 10px; 
            border-radius: 8px; color: #fff; margin: 10px 0; text-align: left;
            font-size: 12px; word-break: break-all;
        }
        .mockup-btn {
            background: linear-gradient(90deg, #ff0844, #ffb199); color: #fff;
            padding: 10px 20px; border-radius: 8px; display: inline-block; font-weight: bold;
        }

        /* Features Section */
        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 50px; text-align: left; }
        .feature-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 20px; transition: transform 0.3s; }
        .feature-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.04); }
        .feature-card h3 { font-size: 20px; margin-bottom: 10px; color: #fff; }
        .feature-card p { font-size: 14px; color: #a1a1aa; line-height: 1.6; }

        /* FAQ Section */
        .faq-section { text-align: left; margin-top: 60px; }
        .faq-item { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 20px 0; }
        .faq-item h4 { font-size: 18px; margin-bottom: 8px; color: #e4e4e7; }
        .faq-item p { font-size: 15px; color: #a1a1aa; line-height: 1.5; }

        /* Footer */
        footer { margin-top: 80px; padding: 40px 20px; border-top: 1px solid rgba(255,255,255,0.05); text-align: center; color: #71717a; font-size: 14px; }
        .footer-links { margin-bottom: 20px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .footer-links a { color: #a1a1aa; text-decoration: none; font-weight: 600; }

        /* Mobile tweaks */
        @media (max-width: 600px) {
            h1 { font-size: 34px; }
            .input-wrapper { flex-direction: column; background: transparent; border: none; }
            input { background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
            .btn-download { width: 100%; }
            .glass-panel { padding: 20px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <header>
        <div class="brand">NovaSave</div>
        <div class="nav-links">
            <span>Features</span>
            <span>FAQ</span>
            <span>EN ⌄</span>
        </div>
    </header>
